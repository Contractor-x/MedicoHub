name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            user/package-lock.json
            admin/package-lock.json

      - name: Install User
        run: npm --prefix user ci

      - name: Install Admin
        run: npm --prefix admin ci

      - name: Build User
        run: npm --prefix user run build

      - name: Build Admin
        run: npm --prefix admin run build

      - name: Prepare Pages Artifact
        run: |
          rm -rf _site
          mkdir -p _site/user _site/admin
          cp -R user/dist/* _site/user/
          cp -R admin/dist/* _site/admin/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>MedicoHub Pages</title>
              <style>
                body { font-family: system-ui, sans-serif; margin: 40px; }
                a { display: inline-block; margin: 8px 0; }
              </style>
            </head>
            <body>
              <h1>MedicoHub</h1>
              <p>Select an app:</p>
              <a href="./user/">User App</a><br />
              <a href="./admin/">Admin App</a>
            </body>
          </html>
          HTML

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
